[project]
name = "ondra-iot-data-platform"
version = "0.1.0"
description = "IoT data platform for Ondra's project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "django-ninja>=1.6.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.5",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.14",
]


