[project]
name = "ondra-iot-data-platform"
version = "0.1.0"
description = "IoT data platform for Ondra's project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "django-ninja>=1.6.2",
    "django-ninja-jwt>=5.4.4",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.5",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.14",
]



[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
addopts = "--ds=app.config.settings --cov=./ --cov-report=term-missing --no-header -p no:cacheprovider --ignore=manage.py"

[tool.ruff]
line-length = 88
target-version = "py313"


[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "B", "UP"]
ignore = ["E501", "UP046"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
disallow_untyped_defs = false
check_untyped_defs = true
strict_optional = false
ignore_missing_imports = true
warn_return_any = false
disable_error_code = ["type-arg", "attr-defined", "no-any-return"]


[tool.django-stubs]
django_settings_module = "app.config.settings"
